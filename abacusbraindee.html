<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abacus Arithmetic Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom focus style for better accessibility */
        .focus-ring-custom:focus {
            outline: 2px solid transparent;
            outline-offset: 2px;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
        }
        /* Animation for screens fading in */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <main id="app-container" class="w-full max-w-lg mx-auto bg-white rounded-2xl shadow-xl p-6 sm:p-8">

        <!-- Login Screen: Now includes Class and Location -->
        <div id="login-screen" class="text-center fade-in">
            <img src="https://lh3.googleusercontent.com/d/1HZFHAka1jl0JSY4z80zr_No9DfR6b30w" alt="BrainDEE Logo" class="mx-auto mb-6 w-40">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Student Login</h1>
            <div class="space-y-4">
                <input type="text" id="name-input" class="w-full text-center text-xl p-3 border-2 border-gray-300 rounded-xl focus-ring-custom" placeholder="Enter Your Full Name">
                <input type="text" id="class-input" class="w-full text-center text-xl p-3 border-2 border-gray-300 rounded-xl focus-ring-custom" placeholder="Enter Your Class">
                <input type="text" id="location-input" class="w-full text-center text-xl p-3 border-2 border-gray-300 rounded-xl focus-ring-custom" placeholder="Enter Your Location">
            </div>
            <button id="login-btn" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl text-lg shadow-md transition-transform transform hover:scale-105 focus-ring-custom">
                Login
            </button>
        </div>

        <!-- Start Screen: Now shown after login -->
        <div id="start-screen" class="hidden text-center">
            <h1 id="welcome-message" class="text-3xl sm:text-4xl font-extrabold text-gray-900 mb-3">Welcome!</h1>
            <p class="text-gray-600 text-lg mb-8">Test your mental math skills with 10 quick questions.</p>
            <button id="start-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl text-xl shadow-md transition-transform transform hover:scale-105 focus-ring-custom">
                Start Test
            </button>
        </div>

        <!-- Test Screen: Where the questions are displayed and answered -->
        <div id="test-screen" class="hidden">
            <header class="flex justify-between items-center mb-6">
                <div id="question-counter" class="text-lg font-semibold text-gray-700 bg-gray-100 px-3 py-1 rounded-lg">Question 1/10</div>
                <div id="timer" class="text-lg font-semibold text-gray-700 bg-gray-100 px-3 py-1 rounded-lg">
                    <span class="font-mono">0s</span>
                </div>
            </header>
            
            <div id="question-area" class="bg-gray-100 rounded-xl p-8 mb-6 flex items-center justify-center min-h-[150px]">
                <p id="question-text" class="text-6xl font-bold text-gray-800 tracking-wide font-mono"></p>
            </div>
            
            <div class="relative">
                <input type="number" id="answer-input" class="w-full text-center text-3xl p-4 border-2 border-gray-300 rounded-xl mb-4 focus-ring-custom transition-colors" placeholder="Type your answer">
                <div id="feedback-message" class="absolute -bottom-2 w-full text-center h-6 text-lg font-medium"></div>
            </div>
            
            <button id="submit-btn" class="w-full mt-4 bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-4 rounded-xl text-xl shadow-md transition-transform transform hover:scale-105 focus-ring-custom">
                Submit
            </button>
        </div>

        <!-- Results Screen: Displays the final score and time -->
        <div id="results-screen" class="hidden text-center">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 mb-4">Challenge Complete!</h1>
            <div class="bg-blue-50 rounded-xl p-6 my-6 space-y-4">
                <div>
                    <p class="text-xl text-gray-600">Your Score</p>
                    <p id="final-score" class="text-7xl font-extrabold text-blue-600"></p>
                </div>
                <div>
                    <p class="text-xl text-gray-600">Total Time</p>
                    <p id="total-time" class="text-5xl font-bold text-blue-600 font-mono"></p>
                </div>
            </div>
            <div class="space-y-3">
                <button id="restart-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl text-xl shadow-md transition-transform transform hover:scale-105 focus-ring-custom">
                    Try Again
                </button>
                <button id="export-btn" class="w-full bg-gray-700 hover:bg-gray-800 text-white font-bold py-3 px-4 rounded-xl text-lg shadow-md transition-transform transform hover:scale-105 focus-ring-custom">
                    Export to Excel (.csv)
                </button>
            </div>
        </div>

    </main>

    <script>
        // --- DOM Element References ---
        const loginScreen = document.getElementById('login-screen');
        const startScreen = document.getElementById('start-screen');
        const testScreen = document.getElementById('test-screen');
        const resultsScreen = document.getElementById('results-screen');

        const loginBtn = document.getElementById('login-btn');
        const startBtn = document.getElementById('start-btn');
        const submitBtn = document.getElementById('submit-btn');
        const restartBtn = document.getElementById('restart-btn');
        const exportBtn = document.getElementById('export-btn');

        const nameInput = document.getElementById('name-input');
        const classInput = document.getElementById('class-input'); // NEW
        const locationInput = document.getElementById('location-input'); // NEW
        const welcomeMessage = document.getElementById('welcome-message');
        const questionCounter = document.getElementById('question-counter');
        const timerDisplay = document.getElementById('timer');
        const questionText = document.getElementById('question-text');
        const answerInput = document.getElementById('answer-input');
        const feedbackMessage = document.getElementById('feedback-message');
        
        const finalScoreDisplay = document.getElementById('final-score');
        const totalTimeDisplay = document.getElementById('total-time');

        // --- Application State ---
        let studentName = '';
        let className = ''; // NEW
        let studentLocation = ''; // NEW
        let questions = [];
        let testResults = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let timerInterval;
        let secondsElapsed = 0;
        const TOTAL_QUESTIONS = 10;

        // --- Core Functions ---
        
        /**
         * MODIFIED: Handles the student login process, now with more fields.
         */
        function handleLogin() {
            const name = nameInput.value.trim();
            const studentClass = classInput.value.trim();
            const location = locationInput.value.trim();

            if (name && studentClass && location) {
                studentName = name;
                className = studentClass;
                studentLocation = location;

                welcomeMessage.textContent = `Welcome, ${studentName}!`;
                loginScreen.classList.add('hidden');
                startScreen.classList.remove('hidden');
                startScreen.classList.add('fade-in');
            } else {
                alert('Please fill in all fields to log in.');
            }
        }

        function generateQuestions() {
            const generated = [];
            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                let num1 = Math.floor(Math.random() * 90) + 10;
                let num2 = Math.floor(Math.random() * 90) + 10;
                const operator = Math.random() > 0.5 ? '+' : '-';
                if (operator === '-' && num1 < num2) [num1, num2] = [num2, num1];
                const questionString = `${num1} ${operator} ${num2}`;
                const answer = (operator === '+') ? num1 + num2 : num1 - num2;
                generated.push({ question: questionString, answer });
            }
            return generated;
        }

        function startTimer() {
            secondsElapsed = 0;
            timerDisplay.innerHTML = `<span class="font-mono">${secondsElapsed}s</span>`;
            timerInterval = setInterval(() => {
                secondsElapsed++;
                timerDisplay.innerHTML = `<span class="font-mono">${secondsElapsed}s</span>`;
            }, 1000);
        }

        function displayQuestion() {
            if (currentQuestionIndex < TOTAL_QUESTIONS) {
                questionCounter.textContent = `Question ${currentQuestionIndex + 1}/${TOTAL_QUESTIONS}`;
                questionText.textContent = questions[currentQuestionIndex].question;
                answerInput.value = '';
                feedbackMessage.textContent = '';
                answerInput.focus();
                answerInput.classList.remove('border-green-500', 'border-red-500');
            } else {
                endTest();
            }
        }

        function startTest() {
            score = 0;
            currentQuestionIndex = 0;
            questions = generateQuestions();
            testResults = [];
            startScreen.classList.add('hidden');
            resultsScreen.classList.add('hidden');
            testScreen.classList.remove('hidden');
            testScreen.classList.add('fade-in');
            displayQuestion();
            startTimer();
        }

        function endTest() {
            clearInterval(timerInterval);
            finalScoreDisplay.textContent = `${score}/${TOTAL_QUESTIONS}`;
            totalTimeDisplay.textContent = `${secondsElapsed}s`;
            testScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');
            resultsScreen.classList.add('fade-in');
        }

        function handleSubmit() {
            const userAnswer = parseInt(answerInput.value, 10);
            if (isNaN(userAnswer)) {
                feedbackMessage.textContent = 'Please enter a number.';
                feedbackMessage.style.color = '#f97316';
                return;
            }
            const currentQuestion = questions[currentQuestionIndex];
            const correctAnswer = currentQuestion.answer;
            const isCorrect = userAnswer === correctAnswer;

            // MODIFIED: Add all student details to results
            testResults.push({
                student: studentName,
                class: className,
                location: studentLocation,
                questionNumber: currentQuestionIndex + 1,
                problem: currentQuestion.question,
                userAnswer: userAnswer,
                correctAnswer: correctAnswer,
                result: isCorrect ? 'Correct' : 'Incorrect'
            });

            if (isCorrect) {
                score++;
                feedbackMessage.textContent = 'Correct!';
                feedbackMessage.style.color = '#22c55e';
                answerInput.classList.add('border-green-500');
            } else {
                feedbackMessage.textContent = `Answer: ${correctAnswer}`;
                feedbackMessage.style.color = '#ef4444';
                answerInput.classList.add('border-red-500');
            }

            currentQuestionIndex++;
            submitBtn.disabled = true;
            setTimeout(() => {
                displayQuestion();
                submitBtn.disabled = false;
            }, 1200);
        }

        /**
         * MODIFIED: Exports results with all new student details.
         */
        function exportResults() {
            let csvContent = "data:text/csv;charset=utf-8,";
            const headers = ["Student Name", "Class", "Location", "Question Number", "Problem", "Your Answer", "Correct Answer", "Result"];
            csvContent += headers.join(",") + "\r\n";

            testResults.forEach(row => {
                const rowArray = [row.student, row.class, row.location, row.questionNumber, `"${row.problem}"`, row.userAnswer, row.correctAnswer, row.result];
                csvContent += rowArray.join(",") + "\r\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            
            const safeFilename = studentName.replace(/[^a-z0-9]/gi, '_').toLowerCase();
            link.setAttribute("download", `abacus_results_${safeFilename}.csv`);
            link.setAttribute("href", encodedUri);
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- Event Listeners Setup ---
        loginBtn.addEventListener('click', handleLogin);
        startBtn.addEventListener('click', startTest);
        restartBtn.addEventListener('click', () => {
            resultsScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            startScreen.classList.add('fade-in');
        });
        submitBtn.addEventListener('click', handleSubmit);
        exportBtn.addEventListener('click', exportResults);

        answerInput.addEventListener('keyup', (event) => { if (event.key === 'Enter') handleSubmit(); });
        nameInput.addEventListener('keyup', (event) => { if (event.key === 'Enter') handleLogin(); });
        classInput.addEventListener('keyup', (event) => { if (event.key === 'Enter') handleLogin(); });
        locationInput.addEventListener('keyup', (event) => { if (event.key === 'Enter') handleLogin(); });
    </script>
</body>
</html>
